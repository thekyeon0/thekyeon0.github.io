---
layout: default
title: "홈"
---
<div class="home">
  <section class="hero">
    <h1>안녕하세요 👋</h1>
    <p>학습한 내용과 생각을 정리하고, 만든 것들을 공유하는 공간입니다.</p>
  </section>

  <section class="recent-posts">
    <h2>최근 글</h2>
    <ul class="post-list">
      {% for post in site.posts limit:5 %}
      <li>
        <time>{{ post.date | date: "%Y.%m.%d" }}</time>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        {% if post.tags %}
          {% for tag in post.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
        {% endif %}
      </li>
      {% endfor %}
    </ul>
    <a href="/archive" class="more-link">전체 글 보기 →</a>
  </section>
</div>
